name: Feature request
description: Propose a feature with testable acceptance criteria
title: "[Feature]: "
labels: ["requirement", "needs-triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Business goal
      description: What problem or opportunity does this address?
      placeholder: Describe the goal and expected outcome.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
      description: Describe the behavior from a user's or caller's perspective.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance direction
      description: List observable conditions that must be true when complete.
      placeholder: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Compatibility, performance, data, security, or rollout constraints.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impacted users and areas
      description: Who is affected, and which workflows or interfaces change?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What is explicitly out of scope?
    validations:
      required: false
