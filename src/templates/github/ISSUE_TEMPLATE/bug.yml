name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide minimal steps, input data, or a reproducible command.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and version
      description: Application version, runtime, OS, or relevant dependency versions.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs and evidence
      description: Paste relevant errors, logs, or links. Remove secrets and sensitive data.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impacted users and areas
      description: Who is affected, how often, and what work is blocked?
    validations:
      required: true
